name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run demo
      - run: npm pack --dry-run
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker pull node:24-bookworm-slim
      - run: npm run test:container
        env:
          MURMUR_CONTAINER_TEST: "1"
      - run: npm run image:build
      - run: npm run test:container
        env:
          MURMUR_AGENT_IMAGE_TEST: "1"
